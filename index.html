<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .login-box p {
            color: #777;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #4facfe;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1689e8;
        }

        .forgot {
            margin-top: 15px;
            font-size: 14px;
        }

        .forgot a {
            color: #1689e8;
            text-decoration: none;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Student Login</h1>
        <p>Welcome to Student Portal</p>

        <form>
            <div class="input-box">
                <input type="text" placeholder="Student ID" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <div class="footer">
            © 2026 Student Portal
        </div>

    </div>

</body>
</html>
